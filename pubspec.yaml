name: controle_frota
description: "Aplicativo de controle de frota, checklists de viaturas e registro de turnos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  image_picker: ^1.1.2
  flex_color_scheme: ^8.4.0
  google_fonts: ^8.2.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.1
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
